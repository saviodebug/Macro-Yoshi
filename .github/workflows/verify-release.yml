name: Verificar distribuição oficial
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-public-release
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validar manifesto, assinatura e executável sem executá-lo
        run: python3 .github/verify_release.py
